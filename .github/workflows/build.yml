name: Compilar APK TVBox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar Licenças e Configurar SDK
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > projeto_app_ativador/local.properties

      - name: Ajustar Manifesto (Remover icone ausente)
        run: |
          sed -i '/android:icon/d' projeto_app_ativador/app/src/main/AndroidManifest.xml
          sed -i '/android:roundIcon/d' projeto_app_ativador/app/src/main/AndroidManifest.xml

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compilar APK
        run: |
          cd projeto_app_ativador
          gradle assembleDebug --stacktrace

      - name: Salvar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Ativador-TVBox-APK
          path: projeto_app_ativador/app/build/outputs/apk/debug/*.apk
