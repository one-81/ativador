name: Compilar APK TVBox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Corrigir Recursos e Layout
        run: |
          sed -i 's/android:layout_maxWidth="520dp"//g' app/src/main/res/layout/activity_main.xml
          sed -i 's/name="Theme.AppCompat.NoActionBar"/name="AppTheme"/g' app/src/main/res/values/styles.xml
          sed -i 's/@style\/Theme.AppCompat.NoActionBar/@style\/AppTheme/g' app/src/main/AndroidManifest.xml

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compilar APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Salvar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Ativador-TVBox-APK
          path: app/build/outputs/apk/debug/*.apk
